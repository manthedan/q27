[package]
name = "q27-tui"
version = "0.1.0"
edition = "2021"
description = "Rust TUI frontend for q27-agent (Frontend Protocol v1)"
license = "MIT"
publish = false

[[bin]]
name = "q27-tui"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
